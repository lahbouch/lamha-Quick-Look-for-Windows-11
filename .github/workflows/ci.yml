name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Lamha.slnx -c Release
      - run: dotnet test tests/Lamha.Tests/Lamha.Tests.csproj -c Release --no-build
